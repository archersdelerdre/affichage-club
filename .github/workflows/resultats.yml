name: Résultats FFTA

on:
  schedule:
    - cron: "0 6 * * 1-4"      # du lundi au jeudi à 6h UTC : les PDF sortent parfois plusieurs jours après
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
    inputs:
      depuis:
        description: "Début de période AAAA-MM-JJ (vide = les 9 derniers jours)"
        required: false
      jusqua:
        description: "Fin de période AAAA-MM-JJ (vide = aujourd'hui)"
        required: false
      relire:
        description: "Relire aussi les PDF déjà lus (à cocher après une correction du script)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: |
          ARGS=""
          if [ "$RELIRE" = "true" ]; then ARGS="--tout"; fi
          python scraper/scrape.py --debut "$DEBUT" --fin "$FIN" $ARGS
        env:
          CLUBS: "CARQUEFOU"
          DEBUT: ${{ inputs.depuis }}
          FIN: ${{ inputs.jusqua }}
          RELIRE: ${{ inputs.relire }}
      - name: Enregistrer les nouveaux résultats
        if: always()
        run: |
          git config user.name "affichage-club"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Résultats mis à jour" && git pull --rebase && git push)
