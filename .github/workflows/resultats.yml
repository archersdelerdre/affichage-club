name: Résultats FFTA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
        env:
          CLUBS: "CARQUEFOU"
      - name: Enregistrer les nouveaux résultats
        run: |
          git config user.name "affichage-club"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Résultats mis à jour" && git push)
